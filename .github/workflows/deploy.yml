name: VIGOR — CI/CD Deploy

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build & Lint Frontend
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: VGR/package-lock.json

      - name: Install dependencies
        working-directory: VGR
        run: npm ci

      - name: Build frontend
        working-directory: VGR
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_SERVER_URL:    ${{ secrets.VITE_API_SERVER_URL }}
          VITE_ADMIN_API_KEY:     ${{ secrets.VITE_ADMIN_API_KEY }}
          VITE_APP_NAME:          VIGOR Admin
          VITE_APP_VERSION:       ${{ github.sha }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: VGR/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build & Test Backend
  # ─────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend (Express)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: VGR/server/package-lock.json

      - name: Install server dependencies
        working-directory: VGR/server
        run: npm ci

      - name: Verify server starts
        working-directory: VGR/server
        env:
          PORT: 3001
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PG_OPERATOR_TOKEN:         test_token
          PG_SECRET_KEY:             test_secret
          NODE_ENV:                  test
        run: |
          timeout 5 node index.js || echo "Server exited (expected in test)"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Deploy Frontend to Vercel (main branch only)
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: VGR
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        working-directory: VGR
        env:
          VERCEL_TOKEN:           ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:          ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID:      ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_SERVER_URL:    ${{ secrets.VITE_API_SERVER_URL }}
          VITE_ADMIN_API_KEY:     ${{ secrets.VITE_ADMIN_API_KEY }}
          VITE_APP_NAME:          VIGOR Admin
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: VGR
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Deploy Backend to Railway (main branch only)
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd VGR/server
          railway up --service vigor-backend --project-id ${{ secrets.RAILWAY_PROJECT_ID }}

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Run Supabase migrations (main branch only)
  # ─────────────────────────────────────────────────────────────
  migrate-db:
    name: Run Supabase Migrations
    needs: [build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        working-directory: VGR
        run: supabase db push
