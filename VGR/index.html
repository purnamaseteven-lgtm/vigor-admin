<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIGOR - Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="login-body">
  <div class="login-bg">
    <div class="login-particles"></div>
  </div>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <h1>VIGOR</h1>
        <p>Admin Management System</p>
      </div>
      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <div class="input-icon">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="username" placeholder="Enter username" autocomplete="off" />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Enter password" />
            <button type="button" class="toggle-pass" onclick="togglePass()"><i class="fa-regular fa-eye"
                id="eyeIcon"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>Verification Code</label>
          <div class="captcha-row">
            <div class="captcha-box" id="captchaDisplay" onclick="refreshCaptcha()">
              <span id="captchaText">-----</span>
              <i class="fa-solid fa-rotate-right"></i>
            </div>
            <input type="text" id="captchaInput" placeholder="Enter code" maxlength="5" />
          </div>
        </div>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <button type="submit" class="btn-login">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>
      <p class="login-footer">© 2019 VIGOR ALL RIGHTS RESERVED</p>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>

</html>
