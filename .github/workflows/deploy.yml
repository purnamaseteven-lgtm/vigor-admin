name: VIGOR — CI/CD Deploy

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build & Test Frontend
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: VGR/package-lock.json

      - name: Install dependencies
        working-directory: VGR
        run: npm ci

      - name: Build frontend
        working-directory: VGR
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_SERVER_URL:    ${{ secrets.VITE_API_SERVER_URL }}
          VITE_ADMIN_API_KEY:     ${{ secrets.VITE_ADMIN_API_KEY }}
          VITE_APP_NAME:          VIGOR Admin
          VITE_APP_VERSION:       ${{ github.sha }}
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build & Test Backend
  # ─────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend (Express)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: VGR/server/package-lock.json

      - name: Install server dependencies
        working-directory: VGR/server
        run: npm ci

      - name: Verify server starts
        working-directory: VGR/server
        env:
          PORT: 3001
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PG_OPERATOR_TOKEN:         test_token
          PG_SECRET_KEY:             test_secret
          ADMIN_API_KEY:             test_key
          NODE_ENV:                  test
        run: timeout 5 node index.js || echo "Server exited (expected in test)"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Deploy Backend to Railway (main branch only)
  # Vercel deployment is handled automatically by Vercel's
  # native GitHub integration (rootDirectory: VGR, framework: vite)
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd VGR/server
          railway up --service vigor-backend --project ${{ secrets.RAILWAY_PROJECT_ID }}

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Run Supabase migrations (main branch only)
  # ─────────────────────────────────────────────────────────────
  migrate-db:
    name: Run Supabase Migrations
    needs: [build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push migrations
        working-directory: VGR
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase db push
